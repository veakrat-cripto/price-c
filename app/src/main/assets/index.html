<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd84a">
<title>Сравнение цен</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@600;700&family=Fira+Sans:wght@400;500&display=swap">
<style>
:root{
  --bg:#e9ecef;--card:#fff;--field:#f4f6f8;--text:#15181c;--muted:#5d6670;--line:#d3d8de;
  --tag:#ffd84a;--tag-text:#15181c;--good:#0b7d37;--good-bg:#dff4e6;--warn:#8a5a00;--warn-bg:#fff0c9;
  --btn:#15181c;--btn-text:#fff;
  --num:"Fira Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Fira Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#101316;--card:#1b2025;--field:#12161a;--text:#eceff2;--muted:#9aa4ae;--line:#323a43;--good:#5fd28a;--good-bg:#12331f;--warn:#f0c15a;--warn-bg:#3a2d0c;--btn:#ffd84a;--btn-text:#15181c;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#101316;--card:#1b2025;--field:#12161a;--text:#eceff2;--muted:#9aa4ae;--line:#323a43;--good:#5fd28a;--good-bg:#12331f;--warn:#f0c15a;--warn-bg:#3a2d0c;--btn:#ffd84a;--btn-text:#15181c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.4 var(--body)}
.bar{background:var(--tag);color:var(--tag-text);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar h1{margin:0;font:700 26px/1 var(--num);letter-spacing:.2px}
.bar button{background:transparent;border:2px solid var(--tag-text);color:var(--tag-text);border-radius:8px;min-height:40px;padding:0 12px;font:500 15px var(--body)}
main{max-width:560px;margin:0 auto;padding:14px 14px 40px;display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;border-left-width:6px}
.card.best{border-left-color:var(--good)}
.top{display:flex;gap:8px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wide{grid-column:1/-1}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
input,select{width:100%;min-height:46px;border:1px solid var(--line);background:var(--field);color:var(--text);border-radius:8px;padding:0 12px;font:500 17px var(--body)}
input::placeholder{color:var(--muted);opacity:.6}
button{font-family:var(--body);cursor:pointer}
:focus-visible{outline:3px solid var(--good);outline-offset:2px}
.rm{flex:none;width:46px;min-height:46px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;font-size:18px}
.min .rm{display:none}
.res{margin-top:12px;display:grid;gap:4px}
.price{font:700 34px/1.05 var(--num)}
.sub{font-size:14px;color:var(--muted)}
.tag{font-size:14px;font-weight:500;padding:6px 10px;border-radius:8px;background:var(--field);justify-self:start}
.tag.good{background:var(--good-bg);color:var(--good)}
.warn{font-size:14px;padding:8px 10px;border-radius:8px;background:var(--warn-bg);color:var(--warn)}
.need{font-size:14px;border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}
.btn{min-height:48px;border:0;border-radius:10px;background:var(--btn);color:var(--btn-text);font:500 16px var(--body);padding:0 16px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
details.card summary{font-weight:500;cursor:pointer;min-height:28px}
details.card .grid{margin-top:10px}
#hist[hidden]{display:none}
.hrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hrow .btn{min-height:40px;padding:0 12px;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--btn);color:var(--btn-text);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;font-size:15px}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="bar"><h1>Сравнение цен</h1><button id="clearBtn" type="button">Очистить</button></div>
<main>
  <section id="hist" class="card" hidden>
    <b>История сравнений</b>
    <div id="histList"></div>
  </section>
  <div id="list" style="display:grid;gap:12px"></div>
  <button id="add" class="btn" type="button">+ Добавить вариант</button>
  <details class="card" id="needBox">
    <summary>Сколько нужно купить</summary>
    <div class="grid">
      <label>Нужно<input id="need" inputmode="decimal" autocomplete="off" placeholder="например, 3"></label>
      <label>Единица<select id="needUnit"></select></label>
    </div>
    <div id="needHint" class="sub" style="margin-top:8px"></div>
  </details>
  <div class="row">
    <button id="save" class="btn ghost" type="button">Сохранить</button>
    <button id="share" class="btn ghost" type="button">Поделиться</button>
    <button id="histBtn" class="btn ghost" type="button">История</button>
  </div>
</main>
<div id="toast" role="status"></div>
<script>
(function(){
var UNITS={'г':{t:'m',f:.001},'кг':{t:'m',f:1},'мл':{t:'v',f:.001},'л':{t:'v',f:1},'шт':{t:'c',f:1},'м':{t:'l',f:1}};
var BASE={m:'кг',v:'л',c:'шт',l:'м'};
var SMALL={m:['100 г',.1],v:['100 мл',.1]};
var OPTS=Object.keys(UNITS).map(function(u){return '<option>'+u+'</option>'}).join('');
var HK='pc_history',DK='pc_draft',MAX=10;
var $=function(id){return document.getElementById(id)};
var list=$('list'),cards=[],last={rs:[],type:null,best:null};

function h(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function num(s){s=String(s).trim().replace(/\s/g,'').replace(',','.');if(s==='')return NaN;return Number(s)}
function fmt(x){var d=x<1?3:2;return new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:d}).format(x)}
function pct(x){return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:x<10?1:0}).format(x*100)}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return v===undefined?null:false}}
function toast(t){var x=$('toast');x.textContent=t;x.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){x.classList.remove('on')},2400)}
function newCard(d){return Object.assign({name:'',price:'',qty:'',unit:'г',packs:'1',disc:''},d||{})}
function plain(c){return {name:c.name,price:c.price,qty:c.qty,unit:c.unit,packs:c.packs,disc:c.disc}}

function build(c){
  var el=document.createElement('section');el.className='card';
  el.innerHTML='<div class="top"><input data-k="name" placeholder="Название (необязательно)" aria-label="Название"><button class="rm" type="button" aria-label="Удалить вариант">✕</button></div>'+
  '<div class="grid">'+
  '<label>Цена, ₽<input data-k="price" inputmode="decimal" autocomplete="off" placeholder="0,00"></label>'+
  '<label>Скидка, %<input data-k="disc" inputmode="decimal" autocomplete="off" placeholder="0"></label>'+
  '<label>Количество в упаковке<input data-k="qty" inputmode="decimal" autocomplete="off" placeholder="0"></label>'+
  '<label>Единица<select data-k="unit">'+OPTS+'</select></label>'+
  '<label class="wide">Упаковок за эту цену<input data-k="packs" inputmode="decimal" autocomplete="off" placeholder="1"></label>'+
  '</div><div class="res"></div>';
  el.querySelectorAll('[data-k]').forEach(function(i){i.value=c[i.dataset.k]});
  c.el=el;return el;
}
function mount(){
  list.replaceChildren.apply(list,cards.map(function(c){return c.el||build(c)}));
  update();
}

function calc(c){
  if(c.price.trim()===''||c.qty.trim()==='')return {wait:true};
  var p=num(c.price),q=num(c.qty),k=c.packs.trim()===''?1:num(c.packs),d=c.disc.trim()===''?0:num(c.disc);
  if(!(p>0)||!(q>0)||!(k>0)||!(d>=0&&d<100)||p>1e9||q>1e9||k>1e6)
    return {err:'Проверьте числа: цена, количество и упаковки больше нуля, скидка от 0 до 99 %.'};
  var u=UNITS[c.unit],price=p*(1-d/100),tot=q*k*u.f;
  return {t:u.t,price:price,tot:tot,unit:price/tot};
}
function needBase(type){
  var hint=$('needHint');hint.textContent='';
  var nv=num($('need').value),nu=UNITS[$('needUnit').value];
  if(!(nv>0)||nv>1e9||!type)return null;
  if(nu.t!==type){hint.textContent='Выберите единицу того же типа, что у вариантов: сравнение идёт в «'+BASE[type]+'».';return null}
  return nv*nu.f;
}

function update(){
  var rs=cards.map(calc);
  var ok=rs.filter(function(r){return r.unit!=null});
  var type=ok.length?ok[0].t:null;
  var comp=ok.filter(function(r){return r.t===type});
  var best=comp.length?Math.min.apply(null,comp.map(function(r){return r.unit})):null;
  var multi=comp.length>1,nb=needBase(type);
  var needText=$('need').value.trim()+' '+$('needUnit').value;
  cards.forEach(function(c,i){
    var r=rs[i],res=c.el.querySelector('.res');res.replaceChildren();
    var isBest=multi&&r.unit!=null&&r.t===type&&r.unit<=best*(1+1e-9);
    c.el.classList.toggle('best',isBest);
    if(r.wait){res.append(h('div','sub','Введите цену и количество'))}
    else if(r.err){res.append(h('div','warn',r.err))}
    else if(r.t!==type){res.append(h('div','warn','Несовместимые единицы: здесь цена за '+BASE[r.t]+', а у первого варианта за '+BASE[type]+'. Эти варианты сравнить нельзя.'))}
    else{
      res.append(h('div','price',fmt(r.unit)+' ₽ / '+BASE[r.t]));
      var s=SMALL[r.t];if(s)res.append(h('div','sub',fmt(r.unit*s[1])+' ₽ за '+s[0]));
      if(multi)res.append(isBest?h('div','tag good','Самый выгодный'):h('div','tag','Дороже на '+pct(r.unit/best-1)+' % (+'+fmt(r.unit-best)+' ₽ за '+BASE[r.t]+')'));
      if(nb){var n=Math.ceil(nb/r.tot-1e-9);res.append(h('div','need','Для '+needText+': '+fmt(nb*r.unit)+' ₽. Целыми упаковками: '+n+' × '+fmt(r.price)+' = '+fmt(n*r.price)+' ₽'))}
    }
  });
  list.classList.toggle('min',cards.length<=2);
  $('add').disabled=cards.length>=MAX;
  last={rs:rs,type:type,best:best,multi:multi};
  store(DK,{cards:cards.map(plain),need:$('need').value,needUnit:$('needUnit').value});
}

function summary(){
  var L=['Сравнение цен:'];
  cards.forEach(function(c,i){
    var r=last.rs[i];
    if(r&&r.unit!=null&&r.t===last.type){
      var b=last.multi&&r.unit<=last.best*(1+1e-9);
      L.push((c.name.trim()||'Вариант '+(i+1))+': '+fmt(r.unit)+' ₽/'+BASE[r.t]+(b?' — выгоднее всего':''));
    }
  });
  return L.length>1?L.join('\n'):'';
}

function renderHist(){
  var items=store(HK)||[],box=$('histList');box.replaceChildren();
  if(!items.length){box.append(h('div','sub','История пуста. Нажмите «Сохранить», чтобы запомнить сравнение.'));return}
  items.forEach(function(e){
    var row=h('div','hrow'),info=h('div');
    info.append(h('b','',e.label),h('div','sub',new Date(e.ts).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'})));
    var o=h('button','btn ghost','Открыть'),d=h('button','btn ghost','Удалить');
    o.type=d.type='button';
    o.onclick=function(){
      cards=e.cards.map(newCard);$('need').value=e.need||'';$('needUnit').value=e.needUnit||'кг';
      $('hist').hidden=true;mount();window.scrollTo(0,0);
    };
    d.onclick=function(){store(HK,(store(HK)||[]).filter(function(x){return x.id!==e.id}));renderHist()};
    row.append(info,o,d);box.append(row);
  });
}

list.addEventListener('input',onEdit);list.addEventListener('change',onEdit);
function onEdit(ev){
  var t=ev.target.closest('[data-k]');if(!t)return;
  var c=cards.find(function(x){return x.el===t.closest('.card')});
  if(c){c[t.dataset.k]=t.value;update()}
}
list.addEventListener('click',function(ev){
  var b=ev.target.closest('.rm');if(!b||cards.length<=2)return;
  var el=b.closest('.card');cards=cards.filter(function(c){return c.el!==el});mount();
});
$('add').onclick=function(){
  if(cards.length>=MAX)return;
  cards.push(newCard());mount();
  var f=cards[cards.length-1].el.querySelector('[data-k="price"]');if(f)f.focus();
};
$('need').addEventListener('input',update);$('needUnit').addEventListener('change',update);

var armed=0,cb=$('clearBtn');
cb.onclick=function(){
  if(!armed){cb.textContent='Точно?';armed=setTimeout(function(){armed=0;cb.textContent='Очистить'},3000);return}
  clearTimeout(armed);armed=0;cb.textContent='Очистить';
  cards=[newCard(),newCard()];$('need').value='';mount();
};
$('save').onclick=function(){
  var filled=cards.filter(function(c){return c.price.trim()!==''||c.qty.trim()!==''});
  if(!filled.length){toast('Пока нечего сохранять');return}
  var label=filled.length+' вар.';
  cards.forEach(function(c,i){var r=last.rs[i];if(last.multi&&r&&r.unit!=null&&r.t===last.type&&r.unit<=last.best*(1+1e-9))label='Лучший: '+(c.name.trim()||'вариант '+(i+1))+', '+fmt(r.unit)+' ₽/'+BASE[r.t]});
  var items=store(HK)||[];
  items.unshift({id:Date.now(),ts:Date.now(),label:label,cards:cards.map(plain),need:$('need').value,needUnit:$('needUnit').value});
  toast(store(HK,items.slice(0,50))?'Сохранено в истории':'Не удалось сохранить: хранилище недоступно');
  if(!$('hist').hidden)renderHist();
};
$('share').onclick=async function(){
  var t=summary();if(!t){toast('Сначала заполните варианты');return}
  try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(t);toast('Скопировано в буфер')}catch(e){toast('Не удалось поделиться')}
};
$('histBtn').onclick=function(){var p=$('hist');p.hidden=!p.hidden;if(!p.hidden){renderHist();p.scrollIntoView({block:'nearest'})}};

$('needUnit').innerHTML=OPTS;$('needUnit').value='кг';
var dr=store(DK);
if(dr&&Array.isArray(dr.cards)&&dr.cards.length){
  cards=dr.cards.slice(0,MAX).map(newCard);while(cards.length<2)cards.push(newCard());
  $('need').value=dr.need||'';if(UNITS[dr.needUnit])$('needUnit').value=dr.needUnit;
}else{cards=[newCard(),newCard()]}
mount();
})();
</script>
</body>
</html>
